name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: Static code checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --all -- --check

  build:
    name: Fedora tests
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:42
    steps:
    - name: Install dependencies
      run: dnf install -y cargo rustfmt clang-devel llvm-devel openssl-devel gcc golang capnproto sqlite-devel git-core elfutils libabigail
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Check out fedora/42/x86_64
      run: |
        git config --global --add safe.directory /__w/podman-sequoia/podman-sequoia
        git branch fedora/42/x86_64 origin/fedora/42/x86_64
    - name: Build
      run: cargo build --verbose
    - name: Check ABI compatibility
      run: abidb --loglevel debug --sysroot target/debug --check target/debug/libpodman_sequoia.so.0
    - name: Run Rust tests
      run: cargo test --verbose
    - name: Run Go tests
      run: make -C go check
